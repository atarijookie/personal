<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORP values</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      h1 { margin: 0 0 12px 0; }
      #status { color: #444; margin: 8px 0 16px 0; }
      .muted { color: #666; font-size: 12px; }
      .err { color: #b00020; }
      .row { display: flex; align-items: center; gap: 10px; margin: 10px 0 14px 0; }
      input[type="date"] { padding: 6px 8px; }
      button { padding: 6px 10px; border: 1px solid #ddd; background: #f7f7f7; border-radius: 8px; cursor: pointer; }
      button:hover { background: #f0f0f0; }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #f7f7f7; }
      canvas { border: 1px solid #eee; border-radius: 10px; background: #fff; }
      h2.chart-section { margin-top: 28px; }
    </style>
  </head>
  <body>
    <h1>ORP values</h1>
    <div id="status" class="muted">Loading device…</div>

    <div class="row">
      <label for="day"><b>Day</b></label>
      <button id="prevDay" type="button" title="Previous day">◀</button>
      <input id="day" type="date" />
      <button id="nextDay" type="button" title="Next day" disabled>▶</button>
      <a href="/" class="muted" style="margin-left: 10px;">Back</a>
    </div>

    <h2 class="chart-section">ORP graph</h2>
    <canvas id="chartOrp" width="1040" height="400"></canvas>

    <script>
      let orpDevice = null;        // first ORP device {id, name}
      let orpDayData = null;       // response from /api/orp_day
      let hoverOrpMs = null;

      const COLOR_TEMP = "#d32f2f";
      const COLOR_ORP = "#4a148c";
      const COLOR_CL = "#2e7d32";

      function todayIso() {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      function isoToLocalDate(iso) {
        const [y, m, d] = iso.split("-").map(n => parseInt(n, 10));
        return new Date(y, m - 1, d);
      }

      function localDateToIso(d) {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      function shiftDay(deltaDays) {
        const dayEl = document.getElementById("day");
        const cur = dayEl.value || todayIso();
        const d = isoToLocalDate(cur);
        d.setDate(d.getDate() + deltaDays);
        const next = localDateToIso(d);
        if (deltaDays > 0 && next > todayIso()) return;
        dayEl.value = next;
        fetchOrpDay();
      }

      function updateNextDayButton() {
        const day = document.getElementById("day").value || todayIso();
        document.getElementById("nextDay").disabled = day >= todayIso();
      }

      /** Košice, SK — WGS84; sun math from SunCalc (c) Vladimir Agafonkin, BSD-2-Clause */
      const KOSICE_LAT = 48.721;
      const KOSICE_LNG = 21.258;

      const kosiceSolarDayTimes = (() => {
        const PI = Math.PI,
          sin = Math.sin,
          cos = Math.cos,
          tan = Math.tan,
          asin = Math.asin,
          atan = Math.atan2,
          acos = Math.acos,
          rad = PI / 180;
        const dayMs = 86400000,
          J1970 = 2440588,
          J2000 = 2451545;
        const e = rad * 23.4397;

        function toJulian(date) {
          return date.valueOf() / dayMs - 0.5 + J1970;
        }
        function fromJulian(j) {
          return new Date((j + 0.5 - J1970) * dayMs);
        }
        function toDays(date) {
          return toJulian(date) - J2000;
        }

        function rightAscension(l, b) {
          return atan(sin(l) * cos(e) - tan(b) * sin(e), cos(l));
        }
        function declination(l, b) {
          return asin(sin(b) * cos(e) + cos(b) * sin(e) * sin(l));
        }

        function solarMeanAnomaly(d) {
          return rad * (357.5291 + 0.98560028 * d);
        }
        function eclipticLongitude(M) {
          const C = rad * (1.9148 * sin(M) + 0.02 * sin(2 * M) + 0.0003 * sin(3 * M)),
            P = rad * 102.9372;
          return M + C + P + PI;
        }
        function sunCoords(d) {
          const M = solarMeanAnomaly(d),
            L = eclipticLongitude(M);
          return { dec: declination(L, 0), ra: rightAscension(L, 0) };
        }

        const times = [
          [-0.833, "sunrise", "sunset"],
          [-6, "dawn", "dusk"],
          [-18, "nightEnd", "night"],
        ];
        const J0 = 0.0009;

        function julianCycle(d, lw) {
          return Math.round(d - J0 - lw / (2 * PI));
        }
        function approxTransit(Ht, lw, n) {
          return J0 + (Ht + lw) / (2 * PI) + n;
        }
        function solarTransitJ(ds, M, L) {
          return J2000 + ds + 0.0053 * sin(M) - 0.0069 * sin(2 * L);
        }
        function hourAngle(h, phi, d) {
          return acos((sin(h) - sin(phi) * sin(d)) / (cos(phi) * cos(d)));
        }
        function observerAngle(height) {
          return (-2.076 * Math.sqrt(height || 0)) / 60;
        }
        function getSetJ(h, lw, phi, dec, n, M, L) {
          const w = hourAngle(h, phi, dec),
            a = approxTransit(w, lw, n);
          return solarTransitJ(a, M, L);
        }

        function getTimes(date, lat, lng, height) {
          const lw = rad * -lng,
            phi = rad * lat,
            dh = observerAngle(height),
            d = toDays(date),
            n = julianCycle(d, lw),
            ds = approxTransit(0, lw, n),
            M = solarMeanAnomaly(ds),
            L = eclipticLongitude(M),
            dec = declination(L, 0),
            Jnoon = solarTransitJ(ds, M, L),
            result = { solarNoon: fromJulian(Jnoon), nadir: fromJulian(Jnoon - 0.5) };
          for (const time of times) {
            const h0 = (time[0] + dh) * rad;
            const Jset = getSetJ(h0, lw, phi, dec, n, M, L);
            const Jrise = Jnoon - (Jset - Jnoon);
            result[time[1]] = fromJulian(Jrise);
            result[time[2]] = fromJulian(Jset);
          }
          return result;
        }

        return function kosiceSolarDayTimesInner(isoDay) {
          const [y, m, d] = isoDay.split("-").map(n => parseInt(n, 10));
          if (!y || !m || !d) return null;
          const ref = new Date(y, m - 1, d, 12, 0, 0, 0);
          return getTimes(ref, KOSICE_LAT, KOSICE_LNG, 0);
        };
      })();

      function solarInstantMs(d) {
        if (!d || !(d instanceof Date)) return null;
        const t = d.getTime();
        return Number.isFinite(t) ? t : null;
      }

      function dayBoundsMs(isoDay) {
        const [y, m, d] = isoDay.split("-").map(n => parseInt(n, 10));
        const start = new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
        const end = new Date(y, m - 1, d + 1, 0, 0, 0, 0).getTime();
        return { start, end, span: end - start };
      }

      function timeMsFromMouseFrac(frac) {
        const iso = document.getElementById("day").value;
        const { start, span } = dayBoundsMs(iso);
        return start + frac * span;
      }

      function xForTimeMs(canvas, tMs) {
        const { left, w } = chartGeometry(canvas);
        const iso = document.getElementById("day").value;
        const { start, span } = dayBoundsMs(iso);
        return left + ((tMs - start) / span) * w;
      }

      function formatTimeLabel(tMs) {
        const d = new Date(tMs);
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        const ss = String(d.getSeconds()).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
      }

      function nearestPoint(series, timeMs) {
        const pts = series.points || [];
        if (!pts.length) return null;
        let best = null;
        let bestD = Infinity;
        for (const p of pts) {
          const tm = Date.parse(p.ts);
          if (Number.isNaN(tm)) continue;
          const d = Math.abs(tm - timeMs);
          if (d < bestD) {
            bestD = d;
            best = p;
          }
        }
        return best;
      }

      function chartGeometry(canvas) {
        const left = 52, right = 100, top = 32, bottom = 32;
        const w = canvas.width - left - right;
        const h = canvas.height - top - bottom;
        return { left, right, top, bottom, w, h, xOrpAxis: left + w, xClAxis: left + w + 48 };
      }

      /** FL = civil dawn (−6°); TD = astronomical dusk (full dark); max = solar noon (Košice). */
      function drawKosiceSolarMarkers(ctx, left, w, top, h, dayStart, daySpan, dayIso, linesOnly) {
        const st = kosiceSolarDayTimes(dayIso);
        if (!st) return;
        const dayEnd = dayStart + daySpan;
        const marks = [
          { t: solarInstantMs(st.dawn), color: "#3949ab", dash: [4, 4], lab: "FL" },
          { t: solarInstantMs(st.sunrise), color: "#e65100", dash: [], lab: "SR" },
          { t: solarInstantMs(st.solarNoon), color: "#b71c1c", dash: [6, 3], lab: "max" },
          { t: solarInstantMs(st.sunset), color: "#5d4037", dash: [], lab: "SS" },
          { t: solarInstantMs(st.night), color: "#263238", dash: [4, 4], lab: "TD" },
        ];
        for (const m of marks) {
          if (m.t === null || m.t < dayStart || m.t > dayEnd) continue;
          const x = left + ((m.t - dayStart) / daySpan) * w;
          const xr = Math.round(x) + 0.5;
          if (linesOnly) {
            ctx.save();
            ctx.strokeStyle = m.color;
            ctx.globalAlpha = 0.9;
            ctx.lineWidth = m.lab === "max" ? 2 : 1.25;
            ctx.setLineDash(m.dash);
            ctx.beginPath();
            ctx.moveTo(xr, top);
            ctx.lineTo(xr, top + h);
            ctx.stroke();
            ctx.restore();
          } else {
            ctx.save();
            ctx.font = "bold 9px system-ui, -apple-system, Segoe UI, Roboto, Arial";
            ctx.fillStyle = m.color;
            const tw = ctx.measureText(m.lab).width;
            let lx = x - tw / 2;
            if (lx < left) lx = left;
            if (lx + tw > left + w) lx = left + w - tw;
            ctx.fillText(m.lab, lx, top + h + 22);
            ctx.restore();
          }
        }
      }

      function strokeSmoothLineThroughPoints(ctx, points) {
        if (!points || points.length === 0) return;
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
      }

      function activeSeries() {
        if (!orpDayData || !orpDayData.series || !orpDayData.series.length) return null;
        return orpDayData.series[0];
      }

      function tempValue(p) {
        if (p.temp === null || p.temp === undefined) return NaN;
        const n = Number(p.temp);
        return Number.isNaN(n) ? NaN : n;
      }

      function orpShownValue(p) {
        if (p.orp === null || p.orp === undefined) return NaN;
        const mv = Number(p.orp);
        if (Number.isNaN(mv)) return NaN;
        const off = p.orp_offset === null || p.orp_offset === undefined ? 0 : Number(p.orp_offset);
        return Number.isNaN(off) ? mv : mv + off;
      }

      function chlorineValue(p) {
        if (p.ppm === null || p.ppm === undefined) return NaN;
        const n = Number(p.ppm);
        return Number.isNaN(n) ? NaN : n;
      }

      function fmtNum(n, digits) {
        if (n === null || n === undefined || Number.isNaN(n)) return "—";
        return Number(n).toFixed(digits);
      }

      function roundedRectPath(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      function yForScale(v, minY, maxY, top, h) {
        return top + (1 - (v - minY) / (maxY - minY)) * h;
      }

      function drawMetricLine(ctx, points, valueFn, yFn, color, dayStart, daySpan, left, w) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        const pts = [...points];
        pts.sort((a, b) => Date.parse(a.ts) - Date.parse(b.ts));
        let seg = [];
        const flushSeg = () => {
          if (seg.length) strokeSmoothLineThroughPoints(ctx, seg);
          seg = [];
        };
        for (const p of pts) {
          const n = valueFn(p);
          if (Number.isNaN(n)) {
            flushSeg();
            continue;
          }
          const tMs = Date.parse(p.ts);
          if (Number.isNaN(tMs)) {
            flushSeg();
            continue;
          }
          const x = left + ((tMs - dayStart) / daySpan) * w;
          seg.push({ x, y: yFn(n) });
        }
        flushSeg();
        ctx.stroke();
      }

      function drawAxisLabels(ctx, ticks, color, x, align, top, h, minY, maxY) {
        ctx.fillStyle = color;
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.textAlign = align;
        ctx.textBaseline = "middle";
        for (const tick of ticks) {
          const y = yForScale(tick.v, minY, maxY, top, h);
          ctx.fillText(tick.label, x, y);
        }
        ctx.textAlign = "left";
        ctx.textBaseline = "alphabetic";
      }

      function drawAxisUnit(ctx, label, color, x, top) {
        ctx.fillStyle = color;
        ctx.font = "bold 11px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText(label, x, top - 10);
        ctx.textAlign = "left";
      }

      function drawTooltip(ctx, canvas, tMs, series) {
        if (tMs === null || tMs === undefined) return;
        const geom = chartGeometry(canvas);
        const x = xForTimeMs(canvas, tMs);
        const p = nearestPoint(series, tMs);
        if (!p) return;

        const lines = [
          { color: COLOR_TEMP, label: "Temperature", value: `${fmtNum(tempValue(p), 1)} °C` },
          { color: COLOR_ORP, label: "ORP", value: `${fmtNum(orpShownValue(p), 1)} mV` },
          { color: COLOR_CL, label: "Chlorine", value: `${fmtNum(chlorineValue(p), 2)} ppm` },
        ];

        ctx.save();
        ctx.strokeStyle = "rgba(0,0,0,0.25)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, geom.top);
        ctx.lineTo(x, geom.top + geom.h);
        ctx.stroke();

        const header = `Time ${formatTimeLabel(tMs)}`;
        const font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        ctx.font = font;

        let width = ctx.measureText(header).width;
        for (const l of lines) {
          width = Math.max(width, ctx.measureText(`${l.label}  ${l.value}`).width + 18);
        }
        width = Math.min(width + 16, 380);

        const height = 24 + lines.length * 16 + 10;
        let bx = x + 10;
        let by = geom.top + 10;
        if (bx + width > canvas.width - 10) bx = x - width - 10;

        ctx.fillStyle = "rgba(255,255,255,0.92)";
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = 1;
        roundedRectPath(ctx, bx, by, width, height, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#111";
        ctx.fillText(header, bx + 10, by + 18);

        let y = by + 36;
        for (const l of lines) {
          ctx.fillStyle = l.color;
          ctx.fillRect(bx + 10, y - 10, 10, 10);
          ctx.fillStyle = "#111";
          ctx.fillText(l.label, bx + 26, y - 1);
          ctx.fillStyle = "#555";
          const valW = ctx.measureText(l.value).width;
          ctx.fillText(l.value, bx + width - 10 - valW, y - 1);
          y += 16;
        }

        ctx.restore();
      }

      function drawChart() {
        const canvas = document.getElementById("chartOrp");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";

        const series = activeSeries();
        const points = series ? (series.points || []) : [];
        const { left, top, w, h, xOrpAxis, xClAxis } = chartGeometry(canvas);
        const dayIso = document.getElementById("day").value;
        const { start: dayStart, span: daySpan } = dayBoundsMs(dayIso);

        const tempMin = 0, tempMax = 40;
        const orpMin = 660, orpMax = 800;
        const clMin = 0, clMax = 10;

        ctx.strokeStyle = "#eee";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 24; i++) {
          const x = left + (i / 24) * w;
          ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + h); ctx.stroke();
        }
        for (let i = 0; i <= 4; i++) {
          const y = top + (i / 4) * h;
          ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + w, y); ctx.stroke();
        }

        ctx.save();
        ctx.strokeStyle = COLOR_TEMP;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(left, top);
        ctx.lineTo(left, top + h);
        ctx.stroke();
        ctx.strokeStyle = COLOR_ORP;
        ctx.beginPath();
        ctx.moveTo(xOrpAxis, top);
        ctx.lineTo(xOrpAxis, top + h);
        ctx.stroke();
        ctx.strokeStyle = COLOR_CL;
        ctx.beginPath();
        ctx.moveTo(xClAxis, top);
        ctx.lineTo(xClAxis, top + h);
        ctx.stroke();
        ctx.strokeStyle = "#bbb";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(left, top + h);
        ctx.lineTo(left + w, top + h);
        ctx.stroke();
        ctx.restore();

        const tempTicks = [0, 10, 20, 30, 40].map(v => ({ v, label: String(v) }));
        const orpTicks = [660, 700, 740, 780, 800].map(v => ({ v, label: String(v) }));
        const clTicks = [0, 2, 4, 6, 8, 10].map(v => ({ v, label: String(v) }));

        drawAxisLabels(ctx, tempTicks, COLOR_TEMP, 8, "left", top, h, tempMin, tempMax);
        drawAxisLabels(ctx, orpTicks, COLOR_ORP, xOrpAxis + 6, "left", top, h, orpMin, orpMax);
        drawAxisLabels(ctx, clTicks, COLOR_CL, xClAxis + 6, "left", top, h, clMin, clMax);
        drawAxisUnit(ctx, "C", COLOR_TEMP, 22, top);
        drawAxisUnit(ctx, "mV", COLOR_ORP, xOrpAxis + 18, top);
        drawAxisUnit(ctx, "ppm", COLOR_CL, xClAxis + 16, top);

        ctx.fillStyle = "#444";
        ctx.textAlign = "center";
        for (let i = 0; i <= 24; i += 3) {
          const x = left + (i / 24) * w;
          ctx.fillText(String(i).padStart(2, "0") + ":00", x, top + h + 14);
        }
        ctx.textAlign = "left";

        drawKosiceSolarMarkers(ctx, left, w, top, h, dayStart, daySpan, dayIso, true);

        if (points.length) {
          drawMetricLine(ctx, points, tempValue, (v) => yForScale(v, tempMin, tempMax, top, h), COLOR_TEMP, dayStart, daySpan, left, w);
          drawMetricLine(ctx, points, orpShownValue, (v) => yForScale(v, orpMin, orpMax, top, h), COLOR_ORP, dayStart, daySpan, left, w);
          drawMetricLine(ctx, points, chlorineValue, (v) => yForScale(v, clMin, clMax, top, h), COLOR_CL, dayStart, daySpan, left, w);
        }

        drawKosiceSolarMarkers(ctx, left, w, top, h, dayStart, daySpan, dayIso, false);

        const legend = [
          { color: COLOR_TEMP, label: "Temperature (°C)" },
          { color: COLOR_ORP, label: "ORP (mV)" },
          { color: COLOR_CL, label: "Chlorine (ppm)" },
        ];
        let lx = left + 8, ly = top + 14;
        ctx.font = "12px system-ui, -apple-system, Segoe UI, Roboto, Arial";
        for (const item of legend) {
          ctx.fillStyle = item.color;
          ctx.fillRect(lx, ly - 10, 10, 10);
          ctx.fillStyle = "#222";
          ctx.fillText(item.label, lx + 14, ly - 1);
          lx += ctx.measureText(item.label).width + 36;
        }

        if (!points.length) {
          ctx.fillStyle = "#666";
          ctx.fillText("No ORP data for this day.", left + 8, top + 36);
        }

        if (hoverOrpMs !== null && series) drawTooltip(ctx, canvas, hoverOrpMs, series);
      }

      function drawCharts() {
        drawChart();
      }

      function deviceLabel(d) {
        if (!d) return "";
        return d.name ? `${d.id} — ${d.name}` : String(d.id);
      }

      async function fetchOrpDay() {
        updateNextDayButton();
        if (!orpDevice) return;
        const day = document.getElementById("day").value;
        try {
          const resp = await fetch("/api/orp_day", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ day, sensor_id: orpDevice.id }),
          });
          const data = await resp.json();
          if (!resp.ok) throw new Error(JSON.stringify(data));
          orpDayData = data;
          const statusEl = document.getElementById("status");
          statusEl.textContent = `Device ${deviceLabel(orpDevice)}.`;
          statusEl.classList.remove("err");
          drawCharts();
        } catch (e) {
          const statusEl = document.getElementById("status");
          statusEl.textContent = "Failed to load day data: " + e;
          statusEl.classList.add("err");
        }
      }

      async function loadDevice() {
        const statusEl = document.getElementById("status");
        try {
          const resp = await fetch("/api/orp_devices", { headers: { "Accept": "application/json" } });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          const devices = await resp.json();
          if (!devices.length) {
            statusEl.textContent = "No ORP devices found.";
            statusEl.classList.add("err");
            return;
          }
          const d = devices[0];
          orpDevice = { id: d.id, name: d.name ?? "" };
          statusEl.textContent = `Device ${deviceLabel(orpDevice)}.`;
          statusEl.classList.remove("err");
          await fetchOrpDay();
        } catch (e) {
          statusEl.textContent = "Failed to load device: " + e;
          statusEl.classList.add("err");
        }
      }

      const dayEl = document.getElementById("day");
      dayEl.value = todayIso();
      dayEl.addEventListener("change", fetchOrpDay);
      document.getElementById("prevDay").addEventListener("click", () => shiftDay(-1));
      document.getElementById("nextDay").addEventListener("click", () => shiftDay(1));

      function attachChartInteractions(canvasId) {
        const canvas = document.getElementById(canvasId);

        canvas.addEventListener("mousemove", (ev) => {
          if (!orpDayData || !orpDayData.series) return;
          const rect = canvas.getBoundingClientRect();
          const x = ev.clientX - rect.left;
          const { left, w } = chartGeometry(canvas);
          const xCanvas = (x / rect.width) * canvas.width;
          if (xCanvas < left || xCanvas > left + w) {
            hoverOrpMs = null;
            drawCharts();
            return;
          }
          const frac = (xCanvas - left) / w;
          hoverOrpMs = timeMsFromMouseFrac(frac);
          drawCharts();
        });

        canvas.addEventListener("mouseleave", () => {
          hoverOrpMs = null;
          drawCharts();
        });
      }

      attachChartInteractions("chartOrp");

      loadDevice();
    </script>
  </body>
</html>
